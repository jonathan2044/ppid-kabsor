# PPID Kabupaten Sorong - https://ppid.sorongkab.go.id
#
# Frontend statis hasil `vite build` + proxy /api ke FastAPI (uvicorn 127.0.0.1:8891).
# Domain berada di belakang Cloudflare yang sudah memaksa HTTPS di edge, jadi origin
# melayani HTTP dan HTTPS tanpa redirect (redirect di origin bisa menyebabkan loop
# jika mode SSL Cloudflare = Flexible).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name ppid.sorongkab.go.id;

    # Path sertifikat ada di snippet ini (awalnya self-signed, diganti enable-ssl.sh)
    include snippets/ppid-kabsor-ssl.conf;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 20m;

    root /var/www/ppid-kabsor/dist/public;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    # POST /auth/register tidak butuh login dan menerima field "role" (bisa "admin"),
    # sementara frontend tidak memakainya - ditutup agar tidak bisa membuat akun admin.
    location = /api/auth/register {
        return 404;
    }

    # Swagger/ReDoc hanya untuk development
    location ~ ^/api/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8891/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # File unggahan (berita, galeri, dokumen, KTP, jawaban). Hanya tipe yang aman
    # dirender browser; tipe lain (html, svg, dll.) dipaksa diunduh.
    location /uploads/ {
        alias /var/www/ppid-kabsor/client/public/uploads/;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            application/pdf pdf;
        }
        default_type application/octet-stream;
        expires 7d;
    }

    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
